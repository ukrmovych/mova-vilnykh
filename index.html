<!doctype html>
<html lang="uk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Мова вільних і небайдужих</title>
<link href="https://fonts.googleapis.com/css2?family=Balsamiq+Sans:wght@400;700&display=swap&subset=cyrillic" rel="stylesheet">
<style>
@font-face{font-family:BalsamiqLocal;font-weight:400;src:local("Balsamiq Sans"),url(fonts/BalsamiqSans-Regular.ttf) format("truetype")}
@font-face{font-family:BalsamiqLocal;font-weight:700;src:local("Balsamiq Sans Bold"),url(fonts/BalsamiqSans-Bold.ttf) format("truetype")}
/* Кольори школи (vilni.school): помаранчевий #f15e38, лавандовий #ecebfb, персиковий #f7e6e1, жовтий #f6d58e, чорний текст.
   Теми оформлення — класи body.v1…v5 (див. змінну DV у скрипті або ?v=1…5 в адресі). */
:root{--o:#f15e38;--od:#c9441d;--ot:#fff1ec;--ink:#111;--mut:#666;--pa:#fffaf6;--cd:#fff;--ln:#111;--bw:.35vh;--sh:.7vh .7vh 0 #111;--ss:.45vh .45vh 0 #111;--sel:#111;--selt:#fff;--lg:#111;--lgt:#fff;--go:#f15e38;--got:#111;--rad:3vh;--dot:rgba(17,17,17,.11)}
*{box-sizing:border-box;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
body{margin:0;height:100vh;overflow:hidden;color:var(--ink);font-family:BalsamiqLocal,"Balsamiq Sans","Segoe UI",system-ui,sans-serif;background-color:var(--pa);background-image:radial-gradient(circle,var(--dot) .2vh,transparent .26vh);background-size:3.2vh 3.2vh}
button{font:inherit;cursor:pointer;color:inherit;border:0;background:none}
#app{height:100vh;padding:3vh 3vw;position:relative}
.card{background:var(--cd);border:var(--bw) solid var(--ln);border-radius:var(--rad);padding:2.4vh 2vw;box-shadow:var(--sh)}
.home{display:grid;grid-template-columns:5fr 7fr;gap:3vw;height:100%}
@media(max-aspect-ratio:1/1){.home{grid-template-columns:1fr;overflow:auto}}
.hero{display:flex;flex-direction:column;gap:2.4vh;justify-content:center;min-height:0}
.logo{align-self:flex-start;position:relative;background:var(--lg);color:var(--lgt);font-size:5.4vh;font-weight:700;line-height:1.12;padding:2vh 2.2vw 2.2vh;border-radius:3.4vh;transform:rotate(-1.2deg);margin-bottom:1.8vh}
.logo:after{content:"";position:absolute;left:3.4vw;bottom:-2.4vh;width:3.4vh;height:2.6vh;background:var(--lg);clip-path:polygon(0 0,100% 0,12% 100%)}
.logo.s{font-size:4.4vh;margin-bottom:2.4vh}
.sub{font-size:2.8vh;color:var(--mut);margin:0}
.wod{display:flex;flex-direction:column;align-items:flex-start;gap:.4vh;transform:rotate(.6deg)}
.wod span{background:var(--o);color:#111;font-size:2.2vh;font-weight:700;padding:.4vh 1vw;border-radius:2vh}
.wod b{font-size:5.6vh}.wod em{font-size:3vh;font-style:normal}.wod small{font-size:2.3vh;color:var(--mut)}
.cd{font-size:2.6vh;font-weight:700;margin-bottom:1vh}
.note{display:block;font-size:2vh;color:var(--mut);margin:.6vh 0 1vh}
.ghost{font-size:2.6vh;padding:1.1vh 1.6vw;border-radius:2vh;border:var(--bw) solid var(--ln);background:var(--cd);box-shadow:var(--ss)}
.setup{display:flex;flex-direction:column;gap:.8vh;overflow:auto}
.lab{font-size:2.3vh;font-weight:700;color:var(--mut);margin-top:1vh}
.pills{display:flex;gap:.8vw;flex-wrap:wrap}
.pill{font-size:2.6vh;padding:1vh 1.4vw;border-radius:5vh;border:var(--bw) solid var(--ln);background:var(--cd)}
.pill.n{min-width:6vh;text-align:center;padding:1vh .8vw}
.pill.on,.tile.on{background:var(--sel);color:var(--selt)}
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:1.2vh .8vw}
.tiles.t3{grid-template-columns:repeat(3,1fr)}
.tile{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;text-align:left;font-size:2.3vh;font-weight:700;padding:.9vh .8vw;border-radius:2.2vh;background:var(--cd);border:var(--bw) solid var(--ln);box-shadow:var(--ss)}
.tile small{display:block;font-size:1.9vh;font-weight:400;opacity:.75}
.tile.t{flex-direction:row;align-items:center;gap:.8vw}.tile.t i{font-style:normal;font-size:3.6vh}
.tile:nth-child(odd){transform:rotate(-.5deg)}.tile:nth-child(even){transform:rotate(.5deg)}
.setup .go{position:sticky;bottom:0}
.go{margin-top:1.4vh;font-size:4vh;font-weight:700;padding:1.6vh 3vw;border-radius:3vh;background:var(--go);color:var(--got);border:var(--bw) solid var(--ln);box-shadow:var(--sh)}
.go:active{transform:translate(.5vh,.5vh);box-shadow:none}
.go:disabled{background:#eee;color:#888;border-color:#bbb;box-shadow:none}
.stage{display:flex;flex-direction:column;height:100%;gap:2vh}
.top{display:flex;align-items:center;justify-content:space-between;gap:1.4vw}
.badge{font-size:3.2vh;font-weight:700;padding:.9vh 1.4vw;border-radius:5vh;background:var(--cd);border:var(--bw) solid var(--ln);white-space:nowrap}
.top .ghost{font-size:2.4vh;padding:.9vh 1.2vw;white-space:nowrap}
.bar{flex:1;height:2.4vh;border-radius:2vh;background:var(--cd);border:var(--bw) solid var(--ln);overflow:hidden}
.bar i{display:block;height:100%;background:var(--o);transition:width 1s linear}
.qc{text-align:center;display:flex;flex-direction:column;justify-content:center;align-items:center;min-height:22vh}
.pre{font-size:2.8vh;color:var(--mut)}
.q{font-size:7vh;font-weight:700;margin-top:1vh;line-height:1.15}.q.sm{font-size:4.4vh}
.q.rd{font-size:3.5vh;font-weight:400;line-height:1.35;max-width:92%}.rq{font-weight:700;margin-top:1.2vh}
.emo{font-size:13vh;line-height:1}.du .emo{font-size:8vh}.du .q{font-size:5vh}.du .q.sm{font-size:3.6vh}.du .q.rd{font-size:2.8vh}
.clue{font-size:3.4vh;margin-top:.6vh}
.opts{display:grid;gap:2vh 1.6vw;flex:1}
.opt{display:flex;align-items:center;gap:1.4vw;text-align:left;font-size:3.6vh;font-weight:700;border-radius:3vh;background:var(--cd);border:var(--bw) solid var(--ln);box-shadow:var(--ss);padding:1.4vh 2vw;transition:.12s}
.opt i{font-style:normal;flex:none;width:6vh;height:6vh;border-radius:50%;background:var(--ink);color:var(--cd);display:grid;place-items:center;font-size:3vh}
.opt:active{transform:scale(.98)}
.opt.ok{background:#22c55e;color:#fff}.opt.ok i{background:#fff;color:#15803d}
.opt.bad{background:#ececec;color:#8a8a8a;border-color:#8a8a8a;box-shadow:none;animation:sk .35s}.opt.bad i{background:#bdbdbd}
@keyframes sk{25%{transform:translateX(-.6vw)}75%{transform:translateX(.6vw)}}
@keyframes pu{50%{transform:scale(1.1)}}
.fb{min-height:9vh;font-size:3vh;border-radius:2vh;padding:1.4vh 2vw;visibility:hidden;border:var(--bw) solid var(--ln);color:#111}
.fb.show{visibility:visible}.fb.g{background:#dcfce7}.fb.r{background:#eef0ff}
.bz{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.6vh;flex:1}
.slots{display:flex;gap:.8vw;justify-content:center}
.slot{width:8.5vh;height:10vh;display:grid;place-items:center;font-size:7vh;font-weight:700;border-bottom:.7vh solid currentColor}
.lts{display:flex;flex-wrap:wrap;gap:1.4vh 1vw;justify-content:center}
.lt{width:11vh;height:11vh;font-size:6.5vh;font-weight:700;border:var(--bw) solid var(--ln);border-radius:2.4vh;background:var(--cd);box-shadow:var(--ss)}
.lt.u{visibility:hidden}.lt.no{animation:sk .35s;background:#ececec;color:#111}.lt.hint{background:#fff1a8;color:#111;animation:pu .9s infinite}
.pn{display:grid;gap:1.4vw;flex:1;min-height:0}
.pl{border-radius:3vh;padding:1.4vh 1.2vw;display:flex;flex-direction:column;gap:1.2vh;border:var(--bw) solid var(--ln);box-shadow:var(--ss);min-height:0;color:#111}
.pl .opt{flex:1;font-size:2.8vh;padding:.8vh 1vw;background:#fff;color:#111}.pl .opt i{width:4.6vh;height:4.6vh;font-size:2.4vh;background:#111;color:#fff}
.pl .opt.ok{background:#22c55e;color:#fff}.pl .opt.bad{background:#ececec;color:#8a8a8a}
.pl .bz{gap:1.2vh}.pl .slot{width:5vh;height:6vh;font-size:4.2vh;border-bottom-width:.5vh}.pl .lts{gap:1vh .6vw}.pl .lt{width:7vh;height:7vh;font-size:4.2vh;border-radius:1.6vh;background:#fff;color:#111}
.pt{display:flex;justify-content:space-between;gap:1vw;font-size:3vh;font-weight:700}
.big{font-size:7vh;font-weight:700;margin:0}
.br{display:grid;grid-template-columns:20vw 1fr 7vw;gap:1.2vw;align-items:center;font-size:3vh;margin:1vh 0}
.br small{font-weight:400;color:var(--mut);font-size:2.2vh}
.tr{height:3vh;border-radius:2vh;background:rgba(127,127,127,.15);border:.25vh solid var(--ln);overflow:hidden}.tr i{display:block;height:100%;background:var(--ink)}
.br:first-child .tr i{background:var(--o)}
.md{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:9}.md .card{text-align:center;padding:4vh 4vw;max-width:70vw}
/* ---- v1 «Бульбашки школи»: лавандовий фон, білі картки-репліки, помаранчевий логотип */
.v1{--pa:#ecebfb;--dot:transparent;--ln:#d9d7f3;--bw:.3vh;--sh:0 1vh 3vh rgba(60,50,150,.12);--ss:0 .5vh 1.4vh rgba(60,50,150,.1);--sel:#1c1c3a;--lg:#f15e38;--lgt:#fff;--go:#f15e38;--got:#fff}
.v1 .card{border-radius:3.6vh 3.6vh 3.6vh .6vh}.v1 .wod{border-radius:3.6vh 3.6vh .6vh 3.6vh}.v1 .tile,.v1 .opt{border-radius:2.4vh 2.4vh 2.4vh .5vh}
.v1 .logo{border-radius:50% 46% 52% 44%/60% 55% 48% 52%;padding:3vh 3vw;transform:rotate(-2deg)}.v1 .logo:after{left:5vw;background:#f15e38}
.v1 .go{border:0}.v1 .tile:nth-child(n),.v1 .wod{transform:none}
/* ---- v2 «Зошит»: базові стилі (чорні контури, крапки, чорна бульбашка) */
/* ---- v3 «Помаранчевий фон»: фон кольору школи, білі картки, чорний текст */
.v3{--pa:#f15e38;--dot:rgba(255,255,255,.22);--lg:#fff;--lgt:#111;--go:#111;--got:#fff;--mut:#555}
.v3 .wod span{background:#111;color:#fff}.v3 .logo:after{background:#fff}
/* ---- v4 «Смужки»: білий фон зі смугами, як на сайті школи, пастельні блоки */
.v4{--pa:#fff;--dot:transparent;--bw:.25vh;--sh:none;--ss:none;--rad:2vh;--sel:#3a3878;--go:#f15e38;--got:#fff}
.v4 #app:before{content:"";position:absolute;left:0;right:0;top:0;height:2.4vh;background:repeating-linear-gradient(100deg,#f15e38 0 3vw,#fff 3vw 3.6vw,#b9b8dc 3.6vw 6.6vw,#fff 6.6vw 7.2vw,#f6d58e 7.2vw 10.2vw,#fff 10.2vw 10.8vw,#f7c9bb 10.8vw 13.8vw,#fff 13.8vw 14.4vw)}
.v4 .logo{background:none;color:#111;padding:0 .4vw;font-size:6vh;transform:none;box-shadow:inset 0 -2vh 0 #f6d58e;border-radius:0}.v4 .logo:after{display:none}
.v4 .wod{background:#f7e6e1;transform:none}.v4 .hero>.card:last-child{background:#ecebfb}.v4 .tile:nth-child(n){transform:none}
/* ---- v5 «Вечірня дошка»: темний фон, крейдяний текст, помаранчевий і жовтий акценти */
.v5{--pa:#17172e;--cd:#24244a;--ink:#fff;--mut:#b9b8dc;--ln:#3d3d72;--bw:.3vh;--sh:none;--ss:none;--sel:#f15e38;--selt:#111;--lg:#f6d58e;--lgt:#111;--go:#f15e38;--got:#111;--dot:rgba(255,255,255,.06)}
.v5 .opt i{background:#f6d58e;color:#111}
/* ==== Теми 6–10 — розвиток «Бульбашок школи» (до них додається клас v1): вільно, м’яко, трохи хаотично ==== */
/* ---- v6 «Наліпки й конфеті»: кольорові кружечки на фоні, картки й плитки нахилені по-різному, пастельні плитки */
body.v6{background-color:#efeefc;background-image:radial-gradient(circle at 7% 12%,#f7c9bb 0 5vh,transparent 5.2vh),radial-gradient(circle at 93% 7%,#f6d58e 0 3vh,transparent 3.2vh),radial-gradient(circle at 46% 97%,#cfcdee 0 6vh,transparent 6.2vh),radial-gradient(circle at 98% 72%,#f15e38 0 1.6vh,transparent 1.8vh),radial-gradient(circle at 2% 82%,#f6d58e 0 2.4vh,transparent 2.6vh),radial-gradient(circle at 58% 3%,#f7c9bb 0 1.4vh,transparent 1.6vh),radial-gradient(circle at 40% 50%,#f15e38 0 .8vh,transparent 1vh);background-size:auto;background-repeat:no-repeat}
.v6 .hero>.card:nth-child(2){transform:rotate(-2deg)}.v6 .hero>.card:nth-child(3){transform:rotate(1.2deg)}.v6 .setup{transform:rotate(-.4deg)}
.v6 .tile:nth-child(4n+1){background:#fff3d6}.v6 .tile:nth-child(4n+2){background:#f7e6e1}.v6 .tile:nth-child(4n+3){background:#e4e3fa}.v6 .tile:nth-child(4n){background:#e3f4ea}
.v6 .tile:nth-child(3n){transform:rotate(1.4deg)}.v6 .tile:nth-child(3n+1){transform:rotate(-1deg)}.v6 .tile:nth-child(3n+2){transform:rotate(.5deg) translateY(.4vh)}
.v6 .pill:nth-child(odd){transform:rotate(-1.5deg)}.v6 .pill:nth-child(even){transform:rotate(1.2deg)}
.v6 .tile.on,.v6 .pill.on{background:#1c1c3a;color:#fff}
/* ---- v7 «Акварель»: розмиті кольорові плями, напівпрозорі картки неправильної форми, пунктирні обводки */
body.v7{background-color:#f3f1fd;background-image:radial-gradient(46vw 50vh at 6% 14%,rgba(241,94,56,.42),transparent 70%),radial-gradient(40vw 50vh at 94% 6%,rgba(140,138,215,.6),transparent 70%),radial-gradient(50vw 46vh at 66% 98%,rgba(246,213,142,.75),transparent 70%),radial-gradient(34vw 40vh at 16% 94%,rgba(247,190,170,.8),transparent 70%),radial-gradient(26vw 30vh at 45% 45%,rgba(200,240,227,.7),transparent 70%);background-size:auto;background-repeat:no-repeat}
.v7{--cd:rgba(255,255,255,.62);--ln:rgba(255,255,255,.95);--sh:0 1.5vh 4vh rgba(90,70,160,.14)}
.v7 .card{-webkit-backdrop-filter:blur(1.2vh);backdrop-filter:blur(1.2vh);border-radius:5vh 3vh 6vh 2vh/4vh 6vh 3vh 5vh}
.v7 .hero>.card:nth-child(3){border-radius:3vh 6vh 2vh 5vh/6vh 3vh 5vh 3vh}
.v7 .logo{background:radial-gradient(circle at 30% 30%,#ff8f6b,#f15e38 60%);box-shadow:0 1.4vh 3vh rgba(241,94,56,.35)}
.v7 .tile,.v7 .pill{border-style:dashed;border-color:#bdbaea}.v7 .tile.on,.v7 .pill.on{border-style:solid;border-color:#1c1c3a}
.v7 .wod span{border-radius:4vh 1vh 4vh 1vh}
/* ---- v8 «Скрапбук»: паперові клаптики на смужках скотчу, нерівний край логотипу, «зошитова» картка слова */
.v8{--pa:#efecfb;--ln:transparent;--sh:0 .8vh 2vh rgba(60,50,150,.16)}
.v8 .card{position:relative;border-radius:1vh}
.v8 .card:before{content:"";position:absolute;top:-1.3vh;left:42%;width:10vh;height:2.6vh;background:repeating-linear-gradient(45deg,rgba(241,94,56,.55) 0 .8vh,rgba(246,213,142,.75) .8vh 1.6vh);transform:rotate(-4deg)}
.v8 .hero>.card:nth-child(2){transform:rotate(-2.5deg)}.v8 .hero>.card:nth-child(3){transform:rotate(1.5deg)}
.v8 .hero>.card:nth-child(3):before{left:12%;background:repeating-linear-gradient(-45deg,rgba(160,158,215,.85) 0 .8vh,rgba(255,255,255,.75) .8vh 1.6vh);transform:rotate(5deg)}
.v8 .setup:before{top:0;left:auto;right:8%}
.v8 .wod{background:repeating-linear-gradient(#fffbea 0 3.4vh,#e4e3fa 3.4vh 3.6vh)}
.v8 .logo{border-radius:0;transform:rotate(-3deg);clip-path:polygon(0 4%,6% 0,15% 5%,25% 0,38% 4%,50% 0,63% 5%,75% 0,88% 4%,100% 0,98% 50%,100% 100%,85% 96%,70% 100%,55% 95%,40% 100%,25% 96%,10% 100%,0 96%,2% 50%)}.v8 .logo:after{display:none}
.v8 .tile{border-radius:.8vh;box-shadow:0 .4vh 1vh rgba(60,50,150,.12)}.v8 .tile:nth-child(odd){transform:rotate(-1.2deg)}.v8 .tile:nth-child(even){transform:rotate(1deg)}
/* Менше чорного в усій родині «Скрапбука» (8, 11–14): обране — пастельне тло з кольоровою обвідкою */
.v8{--ink:#2b2840;--sel:#ffd9cc;--selt:#2b2840;--ring:#f15e38}
.v8 .tile.on,.v8 .pill.on{box-shadow:inset 0 0 0 .45vh var(--ring),0 .4vh 1vh rgba(60,50,150,.12);font-weight:700}
.v8 .opt i{background:#e4e3fa;color:#3a3878}.v8 .pl .opt i{background:#e4e3fa;color:#3a3878}
.v8 .tr i{background:#9d9ad8}.v8 .br:first-child .tr i{background:#f15e38}.v8 .tr{border-color:#cfcdee}
/* ---- v11 «Скрапбук на крафті»: тепле крафтове тло, кремові клаптики, обране — жовте */
body.v11{background-color:#ebe0cc;background-image:radial-gradient(rgba(120,90,50,.1) .15vh,transparent .22vh);background-size:1.2vh 1.2vh;background-repeat:repeat}
.v11{--cd:#fffdf7;--sel:#f6d58e;--ring:#c9a03a}
.v11 .wod{background:repeating-linear-gradient(#fffdf2 0 3.4vh,#efe4cf 3.4vh 3.6vh)}
.v11 .hero>.card:nth-child(3):before{background:repeating-linear-gradient(-45deg,rgba(241,94,56,.6) 0 .8vh,rgba(255,255,255,.75) .8vh 1.6vh)}
/* ---- v12 «Фотокутики»: замість скотчу — лавандові кутики, як у фотоальбомі; обране — лавандове */
.v12 .card:before{display:none}
.v12 .card{background-image:linear-gradient(135deg,#b9b8dc 0 2.2vh,transparent 2.2vh),linear-gradient(-135deg,#b9b8dc 0 2.2vh,transparent 2.2vh),linear-gradient(45deg,#b9b8dc 0 2.2vh,transparent 2.2vh),linear-gradient(-45deg,#b9b8dc 0 2.2vh,transparent 2.2vh);background-position:top left,top right,bottom left,bottom right;background-size:3.2vh 3.2vh;background-repeat:no-repeat}
.v12 .wod{background-color:#fffbea;padding-bottom:4vh}
.v12{--sel:#e4e3fa;--ring:#8f8cd6}
/* ---- v13 «Стікери-нотатки»: картки як кольорові папірці, налаштування на аркуші в клітинку; обране — м’ятне */
.v13{--sh:0 1.4vh 1.4vh -.7vh rgba(60,50,120,.32);--sel:#c8f0e3;--ring:#00ae4d}
.v13 .wod{background:#fff2a8}.v13 .hero>.card:nth-child(3){background:#e4e3fa}
.v13 .setup{background-color:#fff;background-image:linear-gradient(#eceafc .15vh,transparent .15vh),linear-gradient(90deg,#eceafc .15vh,transparent .15vh);background-size:2.6vh 2.6vh}
.v13 .card:before{left:-1.6vh;top:.8vh;width:7vh;transform:rotate(-35deg);background:rgba(200,240,227,.9)}
.v13 .hero>.card:nth-child(3):before{left:auto;right:-1.6vh;transform:rotate(35deg);background:rgba(247,201,187,.9)}
.v13 .setup:before{left:auto;right:-1vh;top:.4vh;transform:rotate(35deg)}
/* ---- v14 «Вирізки»: краї карток вирізані фестоном, на тлі паперові фігури; обране — персикове */
body.v14{background-color:#efeefc;background-image:radial-gradient(circle at 4% 92%,#f7c9bb 0 9vh,transparent 9.2vh),radial-gradient(circle at 97% 4%,#f6d58e 0 7vh,transparent 7.2vh),radial-gradient(circle at 52% 102%,#cfcdee 0 8vh,transparent 8.2vh);background-size:auto;background-repeat:no-repeat}
.v14 .card:before{display:none}
.v14 .hero>.card,.v14 .setup{box-shadow:none;-webkit-mask:radial-gradient(1vh at 1vh 0,#0000 98%,#000) top/2vh 51% repeat-x,radial-gradient(1vh at 1vh 100%,#0000 98%,#000) bottom/2vh 51% repeat-x;mask:radial-gradient(1vh at 1vh 0,#0000 98%,#000) top/2vh 51% repeat-x,radial-gradient(1vh at 1vh 100%,#0000 98%,#000) bottom/2vh 51% repeat-x;padding-top:3vh;padding-bottom:3vh}
.v14 .wod{background:#fde8e0}.v14 .hero>.card:nth-child(3){background:#fff}
/* ---- v9 «Літери в повітрі»: великі напівпрозорі літери на фоні, картки-репліки з хвостиками в різні боки */

read2:`Оленка мала п’ять цукерок. Дві вона віддала братикові.|Скільки цукерок залишилося в Оленки?|3|2;5

(cur.w?`<div class=bz id=bz>${bh(0,'sb')}</div>`:`<div class=opts style="grid-template-columns:${opts.length==3?'1fr':'1fr 1fr'}">${opts.map((o,k)=>`<button class=opt onclick="ans(${k})"><i>${'АБВГ'[k]}</i>${o[0]}</button>`).join('')}</div>`)+`<div id=fb class=fb></div></div>`}
function ans(k){if(lock||tm<=0||PZ)return;lock=1;const ok=opts[k][1];
document.querySelectorAll('.opt').forEach((e,j)=>{if(opts[j][1])e.classList.add('ok');else if(j==k)e.classList.add('bad')});
if(ok){st++;nr++;sc+=10+(st>2?5:0)}else st=0;
fbk(ok);later(()=>{i++;if(tm>0)sq()},ok?1400:2700)}
// Складене слово завжди дає 10 балів; серія (+5) — лише якщо без жодної хибної літери
function sb(p,k){if(lock||tm<=0||PZ)return;const r=bt(0,k);$('bz').innerHTML=bh(0,'sb');if(r==2){lock=1;nr++;if(B[0].x)st=0;else st++;sc+=10+(st>2?5:0);fbk(1);later(()=>{i++;if(tm>0)sq()},1500)}}
function endSolo(){stop();const k=S.cls,ok=rec(k,sc);
const m=ok?`${CL[k][1]} (${CL[k][0]} клас) тепер на ${rank().findIndex(x=>x[0]==k)+1} місці`:'Змагання завершено, результат не записано.';
const kind=['Дякуємо за гру! 🫶','Мова любить сміливих!','Кожна гра — нові слова у скарбничці!'][Math.random()*3|0];
S.cls='';app.innerHTML=`<div class=stage style="justify-content:center"><div class="card" style="text-align:center"><p class=big style="font-size:12vh">⭐ ${sc}</p><p class=sub style="color:var(--ink);font-size:3.4vh">${kind} Правильних відповідей: ${nr}</p><p class=sub style="margin:1vh 0">${m}</p><p class=sub style="margin:0 0 3vh">Спробуйте й інші ігри — там чекають нові завдання.</p><div class=pills style="justify-content:center"><button class=go onclick="classes()">До таблиці</button><button class=ghost onclick="home()">Грати ще</button></div></div></div>`}
// ---- Дуелі. Гравці (2–4): хто перший правильно — тому бал, у таблицю не йде.
// Клас на клас: кожен клас відповідає сам і отримує 10 за правильну, +5 за серію з 3+, +5 найшвидшим; бали йдуть у таблицю.
const QL=()=>cur.w?40:cur.rd?45:25;
function duel(){CM=S.mode=='c';N=CM?S.cs.length:+S.mode;NM=CM?S.cs.map(k=>`«${CL[k][1]}»`):[...Array(N)].map((_,p)=>`Гравець ${p+1}`);SC=Array(N).fill(0);ST=Array(N).fill(0);P=queue(CM?S.cs.map(k=>'c'+k):['d'],S.game).slice(0,10);R=0;let n=5;const r=RUN;
const t=()=>{app.innerHTML=`<div class=stage><div class=top><div class="logo s">Станьте біля своїх екранів!</div></div><div class=pn style="grid-template-columns:repeat(${N==4?2:N},1fr)">${SC.map((s,p)=>`<div class=pl style="background:${COL[p]};justify-content:center;align-items:center"><div class=pt>${NM[p]}</div><p class=big style="font-size:18vh">${n>0?n:'Старт!'}</p></div>`).join('')}</div></div>`};
t();const cd=setInterval(()=>{if(r!=RUN)return clearInterval(cd);n--;if(n<0){clearInterval(cd);dq()}else t()},1000)}
function dq(){clearInterval(TQ);if(R>=P.length)return fin();(CM?S.cs.map(k=>'c'+k):['d']).forEach(k=>see(k,S.game,P[R]));cur=mk(S.game,GM[S.game].it[P[R]]);opts=cur.o;LK=Array(N).fill(0);A=Array(N).fill(0);PK=Array(N).fill(-1);FS=-1;B=[...Array(N)].map(nb);done=0;fbT='';qt=QL();
if(CM)TQ=setInterval(()=>{if(PZ||done)return;qt--;const e=$('qt');if(e)e.textContent='⏱ '+qt;if(qt<=0){A=A.map((x,p)=>x||(ST[p]=0,-1));reveal()}},1000);draw()}
function draw(){app.innerHTML=`<div class="stage du"><div class=top><span class=badge>${R+1} / ${P.length}</span>${CM?`<span class=badge id=qt>⏱ ${qt}</span>`:''}<div class=bar><i style="width:${R/P.length*100}%;transition:none"></i></div>${qbtn}</div><div class="card qc" style="min-height:16vh">${qh()}</div><div class=pn style="grid-template-columns:repeat(${N==4?2:N},1fr)">`+
SC.map((s,p)=>`<div class=pl style="background:${COL[p]};${!CM&&LK[p]?'opacity:.35':''}"><div class=pt><span>${NM[p]}</span><span>${CM&&A[p]==1?'✅ ':''}⭐ ${s}</span></div>${cur.w?`<div class=bz>${bh(p,'dbt')}</div>`:opts.map((o,k)=>`<button class="opt${oc(p,k)}" onclick="da(${p},${k})"><i>${'АБВГ'[k]}</i>${o[0]}</button>`).join('')}</div>`).join('')+
`</div><div class="fb show ${fbT?'g':''}" style="${fbT?'':'visibility:hidden'}">${fbT}</div></div>`}
// Підсвітка варіантів у панелі: свій вибір одразу, правильна відповідь — після завершення питання
const oc=(p,k)=>{if(!done&&PK[p]<0)return'';if(opts[k][1]&&(done||PK[p]==k))return' ok';return PK[p]==k?' bad':''};
function nx(){later(()=>{R++;dq()},2600)}
function gain(p,clean){A[p]=1;ST[p]=clean?ST[p]+1:0;SC[p]+=10+(ST[p]>2?5:0)+(FS<0?5:0);if(FS<0)FS=p}
function reveal(){done=1;clearInterval(TQ);fbT=(FS>=0?`⚡ Найшвидші — ${NM[FS]}. `:'Цього разу ніхто. ')+cur.e;draw();nx()}
function da(p,k){if(done||PZ)return;
if(CM){if(A[p])return;PK[p]=k;if(opts[k][1])gain(p,1);else{A[p]=-1;ST[p]=0}A.every(x=>x)?reveal():draw();return}
if(LK[p])return;PK[p]=k;
if(opts[k][1]){SC[p]++;done=1;fbT=`+1 бал: ${NM[p]}! ${cur.e}`;draw();nx()}
else{LK[p]=1;if(LK.every(x=>x)){done=1;fbT='Цього разу ніхто. '+cur.e;draw();nx()}else draw()}}
// Складання слова в дуелі: хибна літера лише ненадовго «заморожує» панель, без штрафу
function dbt(p,k){if(done||PZ||(CM&&A[p]))return;const r=bt(p,k);if(r==-1)B[p].fz=Date.now()+700;
if(r==2){if(CM){gain(p,!B[p].x);A.every(x=>x)?reveal():draw()}else{SC[p]++;done=1;fbT=`+1 бал: ${NM[p]}! ${cur.e}`;draw();nx()}}else if(r)draw()}
function fin(){const cm=CM;stop();const m=Math.max(...SC),w=SC.map((s,p)=>s==m?p:-1).filter(p=>p>=0);app.dataset.s='h';
const saved=cm?S.cs.map((k,p)=>rec(k,SC[p])).some(Boolean):0;
app.innerHTML=`<div class=stage style="justify-content:center"><div class=card style="text-align:center"><p class=big>${w.length>1?'Нічия! '+w.map(p=>NM[p]).join(' і '):'Перемагає '+NM[w[0]]+'! 🎉'}</p><p class=sub style="margin:2vh 0 1vh">${SC.map((s,p)=>`${NM[p]}: ${s}`).join('  ·  ')}</p><p class=sub style="margin:0 0 3vh">${cm?(saved?'Бали обох класів записано в таблицю. ':'Змагання завершено, бали не записано. '):''}Дякуємо всім за гру! 🫶</p><div class=pills style="justify-content:center">${cm?'<button class=go onclick="classes()">До таблиці</button>':''}<button class=${cm?'ghost':'go'} onclick="home()">Грати ще</button></div></div></div>`}
document.addEventListener('pointerdown',()=>last=Date.now());
setInterval(()=>{const c=$('cdn');if(c)c.textContent=cdt();const w=$('wod');if(w){const h=wodH();if(w.innerHTML!=h)w.innerHTML=h}if(!DEMO&&Date.now()-last>45000&&app.dataset.s!='h'){S.cls='';S.cs=[];home()}},1000);
home();
</script></body></html>
