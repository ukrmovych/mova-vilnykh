// Бали за завдання: 10 за правильну відповідь; у «Склади слово» — 10 без помилок, 5 з помилками
const bpts=b=>b.x?PT/2:PT;
const OKW=['Правильно!','Так!','Чудово!','Влучно!','Саме так!'];
function fbk(ok,extra){const f=$('fb');f.className='fb show '+(ok?'g':'r');f.textContent=(ok?OKW[Math.random()*OKW.length|0]+' ':'Запам’ятаймо: ')+cur.e+(extra||'')}
const later=(f,ms)=>{const r=RUN;setTimeout(()=>{if(r==RUN)f()},ms)};
const optsH=(fn,p)=>opts.map((o,k)=>`<button class="opt${cur.big?' e':''}${p===undefined?'':oc(p,k)}" onclick="${fn}(${p===undefined?'':p+','}${k})">${cur.big?'':`<i>${'АБВГ'[k]}</i>`}${o[0]}</button>`).join('');
const cols=()=>opts.length==3?(cur.big?'1fr 1fr 1fr':'1fr'):'1fr 1fr';
// ---- Гра за свій клас: до 10 нових завдань
function solo(){K=+S.cls;Q=fresh([K],S.game).slice(0,10);i=0;sc=0;nr=0;sq()}
function sq(){if(i>=Q.length)return endSolo();lock=0;cur=mk(S.game,P[S.game].it[Q[i]]);opts=cur.o;B=[nb()];
app.innerHTML=`<div class=stage><div class=top><span class=badge>${i+1} / ${Q.length}</span><div class=bar><i style="width:${i/Q.length*100}%"></i></div><span class=badge>⭐ +${sc}</span>${qbtn}</div><div class="card qc">${qh()}</div>`+
(cur.w?`<div class=bz id=bz>${bh(0,'sb')}</div>`:`<div class=opts style="grid-template-columns:${cols()}">${optsH('ans')}</div>`)+`<div id=fb class=fb></div></div>`}
function ans(k){if(lock||PZ)return;lock=1;const ok=opts[k][1];
document.querySelectorAll('.opt').forEach((e,j)=>{if(opts[j][1])e.classList.add('ok');else if(j==k)e.classList.add('bad')});
award(K,S.game,Q[i],ok?PT:0);if(ok){nr++;sc+=PT}
fbk(ok,ok?' +10':'');later(()=>{i++;sq()},ok?1500:2800)}
function sb(p,k){if(lock||PZ)return;const r=bt(0,k);$('bz').innerHTML=bh(0,'sb');if(r==2){lock=1;const v=bpts(B[0]);award(K,S.game,Q[i],v);nr++;sc+=v;fbk(1,` +${v}`+(v<PT?' (з підказками)':''));later(()=>{i++;sq()},1600)}}
function endSolo(){stop();const k=K,o=ptsOf(k),place=rank().findIndex(x=>x[0]==k)+1,left=fresh([k],S.game).length;
const kind=['Дякуємо за гру! 🫶','Мова любить сміливих!','Кожна гра — нові слова у скарбничці!'][Math.random()*3|0];
S.cls='';app.innerHTML=`<div class=stage style="justify-content:center"><div class="card" style="text-align:center"><p class=big style="font-size:11vh">⭐ +${sc}</p><p class=sub style="color:var(--ink);font-size:3.4vh">${kind} Правильних відповідей: ${nr}</p><p class=sub style="margin:1vh 0">${closed()?'Змагання завершено, бали не записано.':`Клас «${CL[k][1]}»: ${o.p} з ${MAX(CL[k][0])} балів · ${place} місце`}</p><p class=sub style="margin:0 0 3vh">${left?`У цій грі лишилося ще ${left} нових завдань.`:'Цю гру клас пройшов повністю! Спробуйте інші ігри.'}</p><div class=pills style="justify-content:center"><button class=go onclick="classes()">До таблиці</button><button class=ghost onclick="home()">Грати ще</button></div></div></div>`}
// ---- Дуелі. Гравці (2–4): хто перший правильно — тому бал, у таблицю не йде, завдання не витрачаються.
// Клас на клас: кожен клас відповідає сам, 10 балів за правильну відповідь іде в таблицю; завдання зараховуються обом класам.
const QL=()=>cur.w?45:cur.rd?50:30;
function duel(){CM=S.mode=='c';N=CM?S.cs.length:+S.mode;NM=CM?S.cs.map(k=>`«${CL[k][1]}»`):[...Array(N)].map((_,p)=>`Гравець ${p+1}`);SC=Array(N).fill(0);Q=(CM?fresh(S.cs,S.game):sh(P[S.game].it.map((_,j)=>j))).slice(0,10);R=0;let n=5;const r=RUN;
const COL=['#ffd9cc','#c8f0e3','#e2d9ff','#fff0a6'];
const t=()=>{app.innerHTML=`<div class=stage><div class=top><div class="logo s">Станьте біля своїх екранів!</div></div><div class=pn style="grid-template-columns:repeat(${N==4?2:N},1fr)">${SC.map((s,p)=>`<div class=pl style="background:${COL[p]};justify-content:center;align-items:center"><div class=pt>${NM[p]}</div><p class=big style="font-size:18vh">${n>0?n:'Старт!'}</p></div>`).join('')}</div></div>`};
t();const cd=setInterval(()=>{if(r!=RUN)return clearInterval(cd);n--;if(n<0){clearInterval(cd);dq()}else t()},1000)}
function dq(){clearInterval(TQ);if(R>=Q.length)return fin();cur=mk(S.game,P[S.game].it[Q[R]]);opts=cur.o;LK=Array(N).fill(0);A=Array(N).fill(0);PK=Array(N).fill(-1);B=[...Array(N)].map(nb);done=0;fbT='';qt=QL();
if(CM)TQ=setInterval(()=>{if(PZ||done)return;qt--;const e=$('qt');if(e)e.textContent='⏱ '+qt;if(qt<=0){A.forEach((x,p)=>{if(!x){A[p]=-1;award(S.cs[p],S.game,Q[R],0)}});reveal()}},1000);draw()}
const COLD=['#ffd9cc','#c8f0e3','#e2d9ff','#fff0a6'];
function draw(){app.innerHTML=`<div class="stage du"><div class=top><span class=badge>${R+1} / ${Q.length}</span>${CM?`<span class=badge id=qt>⏱ ${qt}</span>`:''}<div class=bar><i style="width:${R/Q.length*100}%"></i></div>${qbtn}</div><div class="card qc" style="min-height:16vh">${qh()}</div><div class=pn style="grid-template-columns:repeat(${N==4?2:N},1fr)">`+
SC.map((s,p)=>`<div class=pl style="background:${COLD[p]};${!CM&&LK[p]?'opacity:.35':''}"><div class=pt><span>${NM[p]}</span><span>${CM&&A[p]==1?'✅ ':''}⭐ ${s}</span></div>${cur.w?`<div class=bz>${bh(p,'dbt')}</div>`:`<div class=opts style="grid-template-columns:${cur.big?'1fr 1fr':'1fr'};gap:1vh">${optsH('da',p)}</div>`}</div>`).join('')+
`</div><div class="fb show ${fbT?'g':''}" style="${fbT?'':'visibility:hidden'}">${fbT}</div></div>`}
const oc=(p,k)=>{if(!done&&PK[p]<0)return'';if(opts[k][1]&&(done||PK[p]==k))return' ok';return PK[p]==k?' bad':''};
function nx(){later(()=>{R++;dq()},2600)}
function reveal(){done=1;clearInterval(TQ);fbT=cur.e;draw();nx()}
function da(p,k){if(done||PZ)return;
if(CM){if(A[p])return;PK[p]=k;const ok=opts[k][1];A[p]=ok?1:-1;if(ok)SC[p]+=PT;award(S.cs[p],S.game,Q[R],ok?PT:0);A.every(x=>x)?reveal():draw();return}
if(LK[p])return;PK[p]=k;
if(opts[k][1]){SC[p]++;done=1;fbT=`+1 бал: ${NM[p]}! ${cur.e}`;draw();nx()}
else{LK[p]=1;if(LK.every(x=>x)){done=1;fbT='Цього разу ніхто. '+cur.e;draw();nx()}else draw()}}
// Складання слова в дуелі: хибна літера лише ненадовго «заморожує» панель
function dbt(p,k){if(done||PZ||(CM&&A[p]))return;const r=bt(p,k);if(r==-1)B[p].fz=Date.now()+700;
if(r==2){if(CM){const v=bpts(B[p]);A[p]=1;SC[p]+=v;award(S.cs[p],S.game,Q[R],v);A.every(x=>x)?reveal():draw()}else{SC[p]++;done=1;fbT=`+1 бал: ${NM[p]}! ${cur.e}`;draw();nx()}}else if(r)draw()}
function fin(){const cm=CM;stop();const m=Math.max(...SC),w=SC.map((s,p)=>s==m?p:-1).filter(p=>p>=0);app.dataset.s='h';
app.innerHTML=`<div class=stage style="justify-content:center"><div class=card style="text-align:center"><p class=big>${w.length>1?'Нічия! '+w.map(p=>NM[p]).join(' і '):'Перемагає '+NM[w[0]]+'! 🎉'}</p><p class=sub style="margin:2vh 0 1vh">${SC.map((s,p)=>`${NM[p]}: +${s}`).join('  ·  ')}</p><p class=sub style="margin:0 0 3vh">${cm?(closed()?'Змагання завершено, бали не записано. ':'Бали кожного класу записано в таблицю. '):''}Дякуємо всім за гру! 🫶</p><div class=pills style="justify-content:center">${cm?'<button class=go onclick="classes()">До таблиці</button>':''}<button class=${cm?'ghost':'go'} onclick="home()">Грати ще</button></div></div></div>`}
document.addEventListener('pointerdown',()=>last=Date.now());
setInterval(()=>{const c=$('cdn');if(c)c.textContent=cdt();const w=$('wod');if(w){const h=wodH();if(w.innerHTML!=h)w.innerHTML=h}if(Date.now()-last>45000&&(app.dataset.s!='h'||$('kp'))){S.cls='';S.cs=[];home()}},1000);
home();
</script></body></html>
