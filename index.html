.tile{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;text-align:left;font-size:2.3vh;font-weight:700;padding:.9vh .8vw;border-radius:2.2vh;background:var(--cd);border:var(--bw) solid var(--ln);box-shadow:var(--ss)}

.setup .go{position:sticky;bottom:0}
.go{margin-top:1vh;font-size:3.6vh;font-weight:700;padding:1.3vh 3vw;border-radius:3vh;background:var(--go);color:var(--got);border:var(--bw) solid var(--ln);box-shadow:var(--sh)}
.go:active{transform:translate(.5vh,.5vh);box-shadow:none}

.stage{display:flex;flex-direction:column;height:100%;gap:2vh}
.top{display:flex;align-items:center;justify-content:space-between;gap:1.4vw}

.top .ghost{font-size:2.4vh;padding:.9vh 1.2vw;white-space:nowrap}
.bar{flex:1;height:2.4vh;border-radius:2vh;background:var(--cd);border:var(--bw) solid var(--ln);overflow:hidden}
.bar i{display:block;height:100%;background:var(--o);transition:width .4s}
.qc{text-align:center;display:flex;flex-direction:column;justify-content:center;align-items:center;min-height:22vh}
.pre{font-size:2.8vh;color:var(--mut)}
.q{font-size:7vh;font-weight:700;margin-top:1vh;line-height:1.15}.q.sm{font-size:4.4vh}
.q.rd{font-size:3.5vh;font-weight:400;line-height:1.35;max-width:92%}.rq{font-weight:700;margin-top:1.2vh}
.emo{font-size:13vh;line-height:1}.du .emo{font-size:8vh}.du .q{font-size:5vh}.du .q.sm{font-size:3.6vh}.du .q.rd{font-size:2.8vh}

.opt{display:flex;align-items:center;gap:1.4vw;text-align:left;font-size:3.6vh;font-weight:700;border-radius:3vh;background:var(--cd);border:var(--bw) solid var(--ln);box-shadow:var(--ss);padding:1.4vh 2vw;transition:.12s}
.opt.e{font-size:12vh;justify-content:center;padding:.6vh 1vw}.pl .opt.e{font-size:6vh}
.opt i{font-style:normal;flex:none;width:6vh;height:6vh;border-radius:50%;background:var(--ink);color:var(--cd);display:grid;place-items:center;font-size:3vh}

.opt.ok{background:#22c55e;color:#fff}.opt.ok i{background:#fff;color:#15803d}
.opt.bad{background:#ececec;color:#8a8a8a;border-color:#8a8a8a;box-shadow:none;animation:sk .35s}.opt.bad i{background:#bdbdbd}
@keyframes sk{25%{transform:translateX(-.6vw)}75%{transform:translateX(.6vw)}}
@keyframes pu{50%{transform:scale(1.1)}}
.fb{min-height:9vh;font-size:3vh;border-radius:2vh;padding:1.4vh 2vw;visibility:hidden;border:var(--bw) solid var(--ln);color:#111}

.bz{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.6vh;flex:1}
.slots{display:flex;gap:.8vw;justify-content:center}

.lts{display:flex;flex-wrap:wrap;gap:1.4vh 1vw;justify-content:center}
.lt{width:11vh;height:11vh;font-size:6.5vh;font-weight:700;border:var(--bw) solid var(--ln);border-radius:2.4vh;background:var(--cd);box-shadow:var(--ss)}

.pn{display:grid;gap:1.4vw;flex:1;min-height:0}
.pl{border-radius:3vh;padding:1.4vh 1.2vw;display:flex;flex-direction:column;gap:1.2vh;border:var(--bw) solid var(--ln);box-shadow:var(--ss);min-height:0;color:#111}
.pl .opt{flex:1;font-size:2.8vh;padding:.8vh 1vw;background:#fff;color:#111}.pl .opt i{width:4.6vh;height:4.6vh;font-size:2.4vh;background:#111;color:#fff}

.big{font-size:7vh;font-weight:700;margin:0}

.kp{background:rgba(0,0,0,.25)}.kp .card{padding:1.4vh 1.2vw;border-radius:2vh}
.kt{margin:0;font-size:2.2vh;font-weight:700}.kt span{font-size:2.6vh;padding:0 .3vw}
.dots{display:flex;gap:.8vh;justify-content:center;margin:1.2vh 0 .4vh}.dots i{width:1.6vh;height:1.6vh;border-radius:50%;border:.25vh solid #8f8cd6;display:block}.dots i.f{background:var(--o);border-color:var(--o)}
.perr{min-height:2vh;font-size:1.6vh;color:#b42318}
.keys{display:grid;grid-template-columns:repeat(3,6.4vh);gap:.8vh;justify-content:center;margin-top:.6vh}
.key{height:6vh;font-size:2.8vh;font-weight:700;border-radius:1.4vh;background:#fff;color:#2b2840;box-shadow:0 .4vh 0 #cfcdee;border:.25vh solid #cfcdee}
.key:active{transform:translateY(.3vh);box-shadow:0 .1vh 0 #cfcdee}.key.k2{font-size:2.4vh;background:#f7e6e1}
/* «Кнопки нижче»: усе, що натискають, — у нижній частині екрана */
.gorow{position:sticky;bottom:0;display:flex;gap:.8vw;align-items:stretch;margin-top:1vh}.gorow .go{flex:1;margin-top:0}
.lowb{font-size:2.3vh;font-weight:700;padding:.9vh 1.2vw;border-radius:2vh;background:#fff1a8;color:#2b2840;white-space:nowrap;box-shadow:var(--ss)}
.low .home{align-items:end}.low .setup{max-height:64vh}.low .hero{justify-content:flex-start}
.low .stage .qc{order:1}.low .stage .fb{order:2;margin-top:auto}.low .stage .opts,.low .stage .bz,.low .stage .pn{order:3;flex:none;height:46vh}.low .stage .top{order:4}
.low .stage[style]{justify-content:flex-end!important}.low .md{place-items:end center;padding-bottom:3vh}
.intro{text-align:left;font-size:2.8vh;margin-top:1vh}.intro p{margin:.8vh 0}

.edf{text-align:left!important;width:min(80vw,120vh);max-width:none!important;display:flex;flex-direction:column;gap:1vh}

.snd{align-self:center;font-size:3vh;font-weight:700;padding:1.2vh 2.4vw;border-radius:2.4vh;background:#fff1a8;color:#2b2840;box-shadow:var(--ss)}.cr{font-size:1.5vh;opacity:.55;align-self:center}
.slot{cursor:pointer}.nwb{background:#ffe066;color:#2b2840;border-radius:1vh;padding:0 .5vw;font-weight:700}
.edf input,.edf textarea{font:inherit;font-size:2.4vh;padding:.8vh 1vw;border:.25vh solid #cfcdee;border-radius:1.2vh;color:#111;-webkit-user-select:text;user-select:text}
.shake{animation:sk .35s}

.v1{--pa:#ecebfb;--dot:transparent;--ln:#d9d7f3;--bw:.3vh;--sh:0 1vh 3vh rgba(60,50,150,.12);--ss:0 .5vh 1.4vh rgba(60,50,150,.1);--sel:#1c1c3a;--lg:#f15e38;--lgt:#fff;--go:#f15e38;--got:#fff}

.v8{--pa:#efecfb;--ln:transparent;--sh:0 .8vh 2vh rgba(60,50,150,.16);--ink:#2b2840;--sel:#ffd9cc;--selt:#2b2840;--ring:#f15e38}

.v8 .tr i{background:#9d9ad8}.v8 .br:first-child .tr i{background:#f15e38}.v8 .tr{border-color:#cfcdee}
/* ---- «Вирізки» (v14): фестонні краї карток, паперові кола на тлі, обране — персикове */
body.v14{background-color:#efeefc;background-image:radial-gradient(circle at 4% 92%,#f7c9bb 0 9vh,transparent 9.2vh),radial-gradient(circle at 97% 4%,#f6d58e 0 7vh,transparent 7.2vh),radial-gradient(circle at 52% 102%,#cfcdee 0 8vh,transparent 8.2vh);background-size:auto;background-repeat:no-repeat}
.v14 .hero>.card,.v14 .duo>.card,.v14 .setup{box-shadow:none;-webkit-mask:radial-gradient(1vh at 1vh 0,#0000 98%,#000) top/2vh 51% repeat-x,radial-gradient(1vh at 1vh 100%,#0000 98%,#000) bottom/2vh 51% repeat-x;mask:radial-gradient(1vh at 1vh 0,#0000 98%,#000) top/2vh 51% repeat-x,radial-gradient(1vh at 1vh 100%,#0000 98%,#000) bottom/2vh 51% repeat-x;padding-top:2.8vh;padding-bottom:2.8vh}
.v14 .wod{background:#fde8e0}

read3:{n:'Читаємо між рядками',i:'🕵️',t:'read',s:'Що не сказано прямо',d:`
+Олег зайшов до класу мокрий, з парасолькою в руці.|Що можна зрозуміти?|надворі дощ|Олег повернувся з басейну;Олег потрапив під поливалку

+У кафе зайшов чоловік у білому халаті, зі стетоскопом на шиї.|Ким, найімовірніше, працює чоловік?|лікарем|кухарем;хіміком
+Попри втому, Ліна дописала реферат до ранку.|Яку рису Ліни видно з тексту?|наполегливість|допитливість;обережність
+Дід глянув на небо, де збиралися хмари, і поспішив згрібати сіно.|Чому дід поспішав?|боявся, що сіно намокне|боявся, що сіно розвіє вітер;хотів закінчити до обіду
+Вікна в класі були відчинені навстіж, але всім однаково було душно.|Яка була погода?|спекотна|вітряна;похмура
+Андрій тричі намагався розв’язати задачу, і лише вчетверте відповідь зійшлася.|Що найкраще описує Андрія?|не здається|швидко вчиться;розв’язує навмання
+З хати тягнувся запах свіжого хліба.|Що, найімовірніше, відбувається в хаті?|печуть хліб|купили хліб у пекарні;готують обід
+Собака радісно махав хвостом і гавкав біля хвіртки.|Що, найімовірніше, сталося?|прийшов знайомий|собака побачив кота;собака зголоднів
+Листя на деревах жовтіє, птахи збираються у зграї.|Яка пора року?|осінь|кінець літа;зима

+Хлопчик стояв біля вітрини з велосипедами й довго не міг відвести очей.|Що відчував хлопчик?|захоплення|заздрість;сум

+Сусід ходив подвір’ям, зазирав під лавки й кликав: «Мурко! Мурко!»|Що сталося?|загубився кіт|утік собака;сусід щось загубив під лавкою
+На вулиці ніхто не мав парасольки, а перехожі мружилися.|Яка погода?|сонячна|вітряна;морозна
+Учитель зайшов до класу, і галас одразу стих.|Що можна зрозуміти?|учні поважають учителя|учні злякалися;учні втомилися
+Ромко щовечора читає під ковдрою з ліхтариком.|Що любить Ромко?|читати|гратися в темряві;малювати
+Після походу в гори Іра всім показувала фото й не могла натішитися.|Як Іра оцінює похід?|він їй дуже сподобався|він був дуже складним;вона вперше фотографувала
+Пес щодня гавкав на листоношу, а сьогодні вперше підбіг і лизнув йому руку.|Що змінилося?|пес подружився з листоношею|прийшов інший листоноша;пес захворів
+«Можна мені ще шматочок?» — попросила Ліза, доїдаючи пиріг.|Що можна сказати про пиріг?|він смачний|він великий;він святковий

+Влад приніс на урок мапу, компас і бінокль.|Про що, найімовірніше, урок?|про подорожі|про астрономію;про спорт

+Ігор зайшов до кухні, принюхався й одразу відчинив духовку.|Що, найімовірніше, сталося?|щось пригорало|Ігор зголоднів;у кухні було задушливо

+Після матчу хлопці мовчки йшли додому, не дивлячись одне на одного.|Чим, найімовірніше, закінчився для них матч?|програшем|сваркою між собою;нічиєю
+Учителька усміхнулася, побачивши малюнок, і повісила його на стенд.|Як учителька оцінила малюнок?|дуже добре|непогано;з подивом

const v=ok&&!ADM?PT+bonus():0;award(K,S.game,Q[i],v);if(ok){nr++;sc+=v}
fbk(ok,v?` +${v}`:ADM?'   ✏️ Щоб виправити — торкніться варіанта, умови чи цього пояснення.':'');if(ADM)return anext();later(()=>{i++;sq()},ok?1500:2800)}

function endSolo(){if(ADM){S.cls='';return home()}stop();const k=K,o=ptsOf(k),place=rank().findIndex(x=>x[0]==k)+1,left=fresh([k],S.game).length;
const kind=['Дякуємо за гру! 🫶','Мова любить сміливих!','Кожна гра — нові слова у скарбничці!'][Math.random()*3|0];
S.cls='';app.innerHTML=`<div class=stage style="justify-content:center"><div class="card" style="text-align:center"><p class=big style="font-size:11vh">⭐ +${sc}</p><p class=sub style="color:var(--ink);font-size:3.4vh">${kind} Правильних відповідей: ${nr}</p><p class=sub style="margin:1vh 0">${closed()?'Змагання завершено, очки не записано.':`Клас «${CL[k][1]}»: ${o.p} з ${MAX(CL[k][0])} очок · ${place} місце`}</p><p class=sub style="margin:0 0 3vh">${left?`У цій грі лишилося ще ${left} нових завдань.`:'Цю гру клас пройшов повністю! Спробуйте інші ігри.'}</p><div class=pills style="justify-content:center"><button class=go onclick="classes()">До таблиці</button><button class=ghost onclick="home()">Грати ще</button></div></div></div>`}
// ---- Дуелі. Гравці (2–4): хто перший правильно — тому очко, у таблицю не йде; лише вже пройдені всіма класами завдання.
// Клас на клас: очки (10 + до 5 за швидкість) отримує лише клас, який першим відповів правильно; завдання зараховуються всім класам.
function duel(){CM=S.mode=='c';N=CM?S.cs.length:+S.mode;NM=CM?S.cs.map(k=>`«${CL[k][1]}»`):[...Array(N)].map((_,p)=>`Гравець ${p+1}`);SC=Array(N).fill(0);Q=(CM?fresh(S.cs,S.game):sh(ADM?P[S.game].it.map((_,j)=>j):used(S.game))).slice(0,10);R=0;let n=5;const r=RUN;
const COL=['#ffd9cc','#c8f0e3','#e2d9ff','#fff0a6'];
const t=()=>{app.innerHTML=`<div class=stage><div class=top><div class="logo s">Станьте біля своїх екранів!</div></div><div class=pn style="grid-template-columns:repeat(${N==4?2:N},1fr)">${SC.map((s,p)=>`<div class=pl style="background:${COL[p]};justify-content:center;align-items:center"><div class=pt>${NM[p]}</div><p class=big style="font-size:${CM?11:18}vh">${n>0?n:'Старт!'}</p></div>`).join('')}</div>${CM?RULEC:''}</div>`};
t();const cd=setInterval(()=>{if(r!=RUN)return clearInterval(cd);n--;if(n<0){clearInterval(cd);dq()}else t()},1000)}
function dq(){clearInterval(TQ);if(AU)AU.pause();if(R>=Q.length)return fin();cur=card(S.game,Q[R]);opts=cur.o||[];LK=Array(N).fill(0);A=Array(N).fill(0);PK=Array(N).fill(-1);B=[...Array(N)].map(nb);done=0;fbT='';if(CM&&!ADM){T0=Date.now();TL=lim()*1000}draw();
if(CM&&!ADM){tick(()=>{if(done)return;S.cs.forEach(c=>award(c,S.game,Q[R],0));reveal('⏰ Час минув. ')})}}
const COLD=['#ffd9cc','#c8f0e3','#e2d9ff','#fff0a6'];
function draw(){app.innerHTML=`<div class="stage du"><div class=top><span class=badge>${R+1} / ${Q.length}</span>${CM&&!ADM?`<span class=badge id=ts>⏱</span><div class=bar><i id=tb style="width:${done?0:Math.max(0,TL-(Date.now()-T0))/TL*100}%;transition:none"></i></div>`:`<div class=bar><i style="width:${R/Q.length*100}%"></i></div>`}${lowB()}${qbtn}</div><div class="card qc" style="min-height:16vh">${qh()}</div><div class=pn style="grid-template-columns:repeat(${N==4?2:N},1fr)">`+
SC.map((s,p)=>`<div class=pl style="background:${COLD[p]};${LK[p]?'opacity:.35':''}"><div class=pt><span>${NM[p]}</span><span>${A[p]==1?'✅ ':''}⭐ ${s}</span></div>${cur.w?`<div class=bz>${bh(p,'dbt')}</div>`:`<div class=opts style="grid-template-columns:${cur.big?'1fr 1fr':'1fr'};gap:1vh">${optsH('da',p)}</div>`}</div>`).join('')+
`</div>${sndH()}<div class="fb show ${fbT?'g':''}" style="${fbT?'':'visibility:hidden'}">${fbT}</div></div>`}
const oc=(p,k)=>{if(!done&&PK[p]<0)return'';if(opts[k][1]&&(done||PK[p]==k))return' ok';return PK[p]==k?' bad':''};
function nx(){later(()=>{R++;dq()},2600)}
function reveal(t){done=1;clearInterval(TQ);fbT=(t||'')+cur.e;draw();nx()}
// Перша правильна відповідь виграє завдання й показує відповідь усім; помилка блокує лише свою панель
function win(p){const v=CM?PT+(ADM?0:bonus()):1;A[p]=1;SC[p]+=v;if(CM)S.cs.forEach((c,q)=>award(c,S.game,Q[R],q==p?v:0));reveal(`${CM?'+'+v+' очок':'+1 очко'}: ${NM[p]}! `)}
function miss(p){LK[p]=1;A[p]=-1;if(LK.every(x=>x)){if(CM)S.cs.forEach(c=>award(c,S.game,Q[R],0));reveal('Цього разу ніхто. ')}else draw()}
function da(p,k){if(done||PZ||LK[p])return;PK[p]=k;opts[k][1]?win(p):miss(p)}
function dbt(p,k){if(done||PZ||LK[p])return;const r=bt(p,k);if(r==2)win(p);else if(r==-2)miss(p);else if(r)draw()}
function fin(){const cm=CM;stop();const m=Math.max(...SC),w=SC.map((s,p)=>s==m?p:-1).filter(p=>p>=0);app.dataset.s='h';
app.innerHTML=`<div class=stage style="justify-content:center"><div class=card style="text-align:center"><p class=big>${w.length>1?'Нічия! '+w.map(p=>NM[p]).join(' і '):'Перемагає '+NM[w[0]]+'! 🎉'}</p><p class=sub style="margin:2vh 0 1vh">${SC.map((s,p)=>`${NM[p]}: +${s}`).join('  ·  ')}</p><p class=sub style="margin:0 0 3vh">${cm?(closed()||ADM?'Очки не записано. ':'Очки кожного класу записано в таблицю. '):''}Дякуємо всім за гру! 🫶</p><div class=pills style="justify-content:center">${cm?'<button class=go onclick="classes()">До таблиці</button>':''}<button class=${cm?'ghost':'go'} onclick="home()">Грати ще</button></div></div></div>`}
// ===================== РЕЖИМ УЧИТЕЛЯ: ПРАВКИ =====================
// Правки зберігаються на цьому пристрої (ub5edits) і одразу діють у грі. Список — кнопка «Мої правки»: його можна скопіювати або завантажити файлом.
const EK='ub5edits';
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
// Старі правки (до нової версії) уже перенесено в гру — прибираємо їх зі списку
(()=>{const e=js(EK);for(const key in e){const x=e[key],a=P[x.g]&&P[x.g].it[x.j];if(!x.v&&(!a||a.join('|')!=x.o.join('|')||!x.f))delete e[key];else if(x.f&&a)P[x.g].it[x.j]=x.f.slice()}sj(EK,e)})();
// Картка завдання з урахуванням правки вчителя (c: умова, питання, усі варіанти, правильний, пояснення)
function card(g,j){const a=P[g].it[j],x=js(EK)[g+':'+j],c=x&&x.c&&x.o.join('|')==a.join('|')?x.c:null;let r;
if(!c)r=mk(g,a);else if(P[g].t=='b')r=mk(g,[c.emo,c.w,c.clue]);else r={g,pre:c.pre,q:c.q,e:c.e,big:P[g].big||P[g].t=='first',rd:P[g].t=='read',o:P[g].t=='syll'?c.o.map(o=>o.slice()):sh(c.o.map(o=>o.slice()))};
r.j=j;return r}
// Текст питання для поля редагування і назад (рядок «❓ …» — окреме питання під текстом)
const plain=h=>h.replace(/<div class=rq>/g,'\n❓ ').replace(/<br>/g,'\n').replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&amp;/g,'&');
const unplain=(t,h)=>{const L=t.split('\n').map(x=>x.trim()).filter(x=>x),em=h.startsWith('<span class=emo>');return L.map((l,n)=>l.startsWith('❓')?`<div class=rq>${esc(l.replace(/^❓\s*/,''))}</div>`:(n==0&&em?`<span class=emo>${esc(l)}</span>`:esc(l))).join('<br>').replace(/<br><div/g,'<div')};
function ed(k){AH=1;if($('ed'))return;const g=S.game,j=cur.j,old=js(EK)[g+':'+j]||{},m=document.createElement('div');m.id='ed';m.className='md';
const f=(l,id,v,ta)=>`<label>${l}${ta?`<textarea id=${id} rows=${ta}>${esc(v)}</textarea>`:`<input id=${id} value="${esc(v)}">`}</label>`;
m.innerHTML=`<div class="card edf"><p class=big style="font-size:3.4vh">✏️ ${P[g].n} · завдання №${j+1}</p>`+(cur.w?f('Емодзі','e_emo',plain(cur.q))+f('Слово','e_w',cur.w.join('').toLowerCase())+f('Підказка','e_cl',cur.pre):
f('Умова (над питанням)','e_pre',cur.pre)+f('Питання','e_q',plain(cur.q),3)+`<div class=lab>Варіанти відповіді — позначте правильний</div>`+opts.map((o,n)=>`<div class=eo><input type=radio name=eok value=${n}${o[1]?' checked':''}><input class=eot value="${esc(o[0])}"></div>`).join('')+f('Пояснення після відповіді','e_e',cur.e,2))+
f('Коментар для Claude (за потреби)','enote',old.note||'',2)+`<div class=perr id=eerr></div><div class=pills style="justify-content:flex-end"><button class=ghost onclick="$('ed').remove()">Скасувати</button><button class=go onclick="eds()">Зберегти</button></div></div>`;document.body.appendChild(m);const t=k===undefined?null:m.querySelectorAll('.eot')[k];if(t)t.focus()}
function eds(){const g=S.game,j=cur.j,key=g+':'+j,e=js(EK),a=P[g].it[j],note=$('enote').value.trim(),er=t=>{$('eerr').textContent=t};let c;
if(cur.w){const w=$('e_w').value.trim();if(!w)return er('Слово не може бути порожнім.');c={emo:$('e_emo').value.trim(),w,clue:$('e_cl').value.trim()};if(c.w==cur.w.join('').toLowerCase()&&c.clue==cur.pre&&c.emo==plain(cur.q))c=null}
else{const os=[...document.querySelectorAll('.eot')].map(x=>[x.value.trim(),0]),ck=document.querySelector('input[name=eok]:checked');if(!ck)return er('Позначте правильний варіант.');if(os.some(o=>!o[0]))return er('Варіант не може бути порожнім.');os[+ck.value][1]=1;
const qt=$('e_q').value;c={pre:$('e_pre').value.trim(),q:qt.trim()==plain(cur.q).trim()?cur.q:unplain(qt,cur.q),o:os,e:$('e_e').value.trim()};if(c.pre==cur.pre&&c.q==cur.q&&c.e==cur.e&&JSON.stringify(os)==JSON.stringify(opts))c=null}
const prev=e[key]&&e[key].c&&e[key].o.join('|')==a.join('|')?e[key].c:null;c=c||prev;
if(!c&&!note)delete e[key];else e[key]={g,j,v:2,o:a.slice(),c,note,at:new Date().toLocaleString('uk-UA')};sj(EK,e);$('ed').remove();sq()}
const ctx=c=>c.w?`${c.emo} | ${c.w} | ${c.clue}`:`Умова: ${c.pre}\nПитання: ${plain(c.q).replace(/\n/g,' / ')}\n`+c.o.map(o=>(o[1]?'✓ ':'✗ ')+o[0]).join('\n')+`\nПояснення: ${c.e}`;
function edl(){const e=js(EK),l=Object.values(e);const txt=l.map(x=>`[${x.g} №${x.j+1}] ${P[x.g]?P[x.g].n:x.g}\nБуло:  ${x.o.join(' | ')}\n`+(x.c?`Стало:\n${ctx(x.c)}\n`:x.f?`Стало: ${x.f.join(' | ')}\n`:'')+(x.note?`Коментар: ${x.note}\n`:'')).join('\n')+(l.length?'\n---JSON---\n'+JSON.stringify(e):'');
const m=document.createElement('div');m.id='ed';m.className='md';m.innerHTML=`<div class="card edf"><p class=big style="font-size:3.4vh">Мої правки: ${l.length}</p><p class=sub>Надішліть цей текст або файл Claude — і правки буде перенесено в гру для всіх.</p><textarea readonly rows=12 id=etxt>${esc(txt||'Правок поки немає.')}</textarea><div class=pills style="justify-content:flex-end"><button class=ghost onclick="if(confirm('Видалити всі правки з цього пристрою?')){localStorage.removeItem(EK);location.reload()}">Очистити</button><button class=ghost onclick="navigator.clipboard.writeText($('etxt').value).then(()=>this.textContent='Скопійовано ✓')">Скопіювати</button><button class=ghost onclick="edf()">Завантажити файл</button><button class=go onclick="$('ed').remove()">Закрити</button></div></div>`;document.body.appendChild(m)}
function edf(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([$('etxt').value],{type:'text/plain;charset=utf-8'}));a.download='правки-мовна-гра.txt';a.click()}

setInterval(()=>{const c=$('cdn');if(c)c.textContent=cdt();const w=$('wod');if(w){const h=wodH();if(w.innerHTML!=h)w.innerHTML=h}if($('ed'))return;if(Date.now()-last>(ADM?180000:45000)&&(app.dataset.s!='h'||$('kp')||S.low)){S.cls='';S.cs=[];if(S.low)tl();home()}},1000);
